[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-test-agent"
version = "0.1.0"
description = "Local MCP-backed folder RAG test agent with a web UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "mcp>=1.13",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
documents = [
    "pypdf>=4",
    "python-docx>=1.1",
]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
rag-test-agent = "rag_agent.web:main"
rag-filesystem-mcp = "rag_agent.mcp_filesystem_server:main"

[tool.hatch.build.targets.wheel]
packages = ["rag_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
