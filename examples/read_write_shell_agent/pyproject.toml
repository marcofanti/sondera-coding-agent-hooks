[project]
name = "read-write-shell-agent"
version = "0.1.0"
description = "PydanticAI read/write/shell agent, governed by Sondera at two layers"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=2.13.0",
    "python-dotenv>=1.2.2",
    "sondera",
]

[tool.uv.sources]
sondera = { path = "../../sondera-python", editable = true }

[tool.hatch.build.targets.wheel]
# Nothing to install as a package — these are runnable scripts.
bypass-selection = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
